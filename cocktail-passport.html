const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(d){return `<div class="micro">${esc(d.date)} · ${esc(d.city)}</div><div class="drink">${esc(d.name)}</div><div class="bar">${esc(d.bar)}</div>${d.type?`<div class="drink-type">${esc(d.type)}</div>`:''}<div class="taste">${esc(d.taste)}</div>`}
function select(i){const d=drinks[i];document.querySelector('#feature').innerHTML=card(d);document.querySelector('#mapLabel').textContent=d.city.toUpperCase();document.querySelectorAll('.pin').forEach((p,n)=>p.classList.toggle('active',n===i));}
document.querySelector('#pins').innerHTML=drinks.map((d,i)=>`<button class="pin" aria-label="${esc(d.name)}" data-i="${i}" style="left:${d.x}%;top:${d.y}%"></button>`).join('');
document.querySelectorAll('.pin').forEach(p=>p.onclick=()=>select(+p.dataset.i)); select(0);
document.querySelector('#drinkCount').textContent=String(drinks.length).padStart(2,'0');document.querySelector('#cityCount').textContent=String(new Set(drinks.map(d=>d.city)).size).padStart(2,'0');
const pd=d=>{const[y,m,day]=d.date.split('.').map(Number);return{y,m,day}};
let chartLevel='year',chartYear=null,chartMonth=null;
function dayBlockHTML(y,m,day){const dayDrinks=drinks.filter(d=>{const p=pd(d);return p.y===y&&p.m===m&&p.day===day});const dt=`${y}.${String(m).padStart(2,'0')}.${String(day).padStart(2,'0')}`;const cities=[...new Set(dayDrinks.map(d=>d.city))].join(' / ');return `<div class="day-block"><div class="day-head"><span class="date">${dt}</span><span class="day-cities">${esc(cities)}</span></div><div class="day-items">${dayDrinks.map(d=>`<article class="day-item"><span class="name">${esc(d.name)}</span><span class="bar">${esc(d.bar)}</span><p>${esc(d.taste)}</p></article>`).join('')}</div></div>`}
function renderChart(){
  const barsEl=document.querySelector('#chartBars'),titleEl=document.querySelector('#chartTitle'),backEl=document.querySelector('#chartBack'),listEl=document.querySelector('#chartDayList');
  listEl.innerHTML='';
  if(chartLevel==='year'){
    backEl.style.display='none';
    titleEl.textContent='按年查看 · 点击柱子看月份';
    const years=[...new Set(drinks.map(d=>pd(d).y))].sort((a,b)=>a-b);
    const counts=years.map(y=>drinks.filter(d=>pd(d).y===y).length);
    const max=Math.max(...counts,1);
    barsEl.innerHTML=years.map((y,i)=>`<button class="bar-col" data-y="${y}"><span class="bar-val">${counts[i]}</span><span class="bar-fill" style="height:${counts[i]/max*100}%"></span><span class="bar-label">${y}</span></button>`).join('');
    barsEl.querySelectorAll('.bar-col').forEach(el=>el.onclick=()=>{chartYear=+el.dataset.y;chartLevel='month';renderChart()});
  }else if(chartLevel==='month'){
    backEl.style.display='inline-block';
    titleEl.textContent=`${chartYear} 年 · 点击柱子看当天`;
    const counts=[];for(let m=1;m<=12;m++)counts.push(drinks.filter(d=>{const p=pd(d);return p.y===chartYear&&p.m===m}).length);
    const max=Math.max(...counts,1);
    barsEl.innerHTML=counts.map((c,i)=>`<button class="bar-col${c?'':' empty'}" data-m="${i+1}"${c?'':' disabled'}><span class="bar-val">${c||''}</span><span class="bar-fill" style="height:${c/max*100}%"></span><span class="bar-label">${i+1}月</span></button>`).join('');
    barsEl.querySelectorAll('.bar-col:not(.empty)').forEach(el=>el.onclick=()=>{chartMonth=+el.dataset.m;chartLevel='day';renderChart()});
  }else if(chartLevel==='day'){
    backEl.style.display='inline-block';
    titleEl.textContent=`${chartYear}.${String(chartMonth).padStart(2,'0')} · 点击柱子看酒单`;
    const daysInMonth=new Date(chartYear,chartMonth,0).getDate();
    const counts=[];for(let day=1;day<=daysInMonth;day++)counts.push(drinks.filter(d=>{const p=pd(d);return p.y===chartYear&&p.m===chartMonth&&p.day===day}).length);
    const max=Math.max(...counts,1);
    barsEl.innerHTML=counts.map((c,i)=>`<button class="bar-col${c?'':' empty'}" data-d="${i+1}"${c?'':' disabled'}><span class="bar-val">${c||''}</span><span class="bar-fill" style="height:${c/max*100}%"></span><span class="bar-label">${i+1}</span></button>`).join('');
    barsEl.querySelectorAll('.bar-col:not(.empty)').forEach(el=>el.onclick=()=>{listEl.innerHTML=dayBlockHTML(chartYear,chartMonth,+el.dataset.d)});
  }
}
document.querySelector('#chartBack').onclick=()=>{if(chartLevel==='day')chartLevel='month';else if(chartLevel==='month')chartLevel='year';renderChart()};
renderChart();
document.querySelector('#galleryList').innerHTML=drinks.map(d=>`<article class="card" tabindex="0"><div class="photo ${d.size}" style="--photo:${d.color}"><img src="${esc(d.photo||'')}" alt="${esc(d.name)}" onerror="this.remove()"></div><div class="card-text"><div class="city">${esc(d.city)} · ${esc(d.date)}</div><h2>${esc(d.name)}</h2><div class="micro">${esc(d.bar)}</div>${d.type?`<div class="drink-type">${esc(d.type)}</div>`:''}<p>${esc(d.taste)}</p></div></article>`).join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(e=>e.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.view).classList.add('active')});
</script></body></html>
